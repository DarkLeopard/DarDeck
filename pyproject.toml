[project]
name = "dardeck"
version = "0.1.0"
description = "Delight — card engine for couples (pure library, no framework binding)"
requires-python = ">=3.12"
dependencies = [
    "aiogram>=3",
]

[project.optional-dependencies]
dev = [
    "pytest",
]

# Все пакеты рантайма: ядро, адаптеры (db/rules — подпакеты), бот, CLI-инструменты.
[tool.setuptools.packages.find]
include = ["engine*", "adapters*", "bots*", "tools*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
