<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <title>DarDeck Dark</title>
  <!--
    Прототип офлайн: без CDN и фреймворков (см. docs/miniapp-research.md).
    В webview Telegram объект window.Telegram.WebApp инжектится клиентом,
    поэтому themeParams читаем напрямую, без telegram-web-app.js.
  -->
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">

    <header class="app-header safe-area-top">
      <div class="header-brand">
        <span class="header-logo">🎴</span>
        <span class="header-title">DarDeck Dark</span>
      </div>
      <span id="env-badge" class="badge" hidden>прототип</span>
    </header>

    <main id="screens" class="safe-area-bottom">

      <!-- Экран: Главное меню -->
      <section id="screen-home" class="screen">
        <p class="greeting">Что сегодня?</p>

        <button id="btn-draw" class="btn btn-primary btn-big" type="button">
          <span class="btn-big-icon">🎲</span>
          <span>Дать фант</span>
        </button>

        <!-- Кулдаун-заглушка -->
        <div id="cooldown" class="cooldown" hidden>
          <span class="cooldown-icon">⏳</span>
          <span class="cooldown-text">Ещё немного</span>
          <span id="cooldown-timer" class="cooldown-timer">0:47</span>
          <span class="cooldown-hint">Новый фант скоро</span>
        </div>

        <nav class="menu-list">
          <button class="menu-item" data-nav="history" type="button">
            <span>🧾</span><span>История</span>
          </button>
          <button class="menu-item" data-nav="nothing" type="button" disabled>
            <span>⚙️</span><span>Настройки — позже</span>
          </button>
        </nav>

        <p class="deck-note">Дека: Фанты для пар · 10 карточек в моке</p>
      </section>

      <!-- Экран: Карточка -->
      <section id="screen-card" class="screen" hidden>
        <div class="screen-nav">
          <button class="btn-back" data-nav="home" type="button" aria-label="Назад">← Назад</button>
          <span class="card-tag">✦ ФАНТ ✦</span>
        </div>

        <article class="card">
          <h2 id="card-title" class="card-title">—</h2>
          <p id="card-text" class="card-text">—</p>
          <p id="card-meta" class="card-meta">—</p>
        </article>

        <div class="card-actions">
          <button id="btn-done" class="btn btn-primary" type="button">✅ Выполнено</button>
          <button id="btn-rate" class="btn btn-secondary" type="button">⭐ Оценить</button>
        </div>
        <div class="card-actions card-actions-row">
          <button class="btn btn-icon" data-react="like" type="button" aria-label="Нравится">👍</button>
          <button class="btn btn-icon" data-react="dislike" type="button" aria-label="Не нравится">👎</button>
          <button class="btn btn-icon" data-react="warn" type="button" aria-label="Жалоба">⚠</button>
        </div>
        <p id="card-feedback" class="card-feedback" aria-live="polite"></p>
      </section>

      <!-- Экран: История (мок-данные) -->
      <section id="screen-history" class="screen" hidden>
        <div class="screen-nav">
          <button class="btn-back" data-nav="home" type="button" aria-label="Назад">← Назад</button>
        </div>
        <h2 class="screen-title">История · за 7 дней</h2>
        <ul id="history-list" class="history-list"></ul>
        <p class="history-note">Полная история — в боте. Данные моковые.</p>
      </section>

    </main>
  </div>

  <script src="mock.js"></script>
  <script src="app.js"></script>
</body>
</html>
